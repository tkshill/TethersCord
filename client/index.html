<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>TTRPG Discord Activity</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      /* Fonts (roadmap 32.1), self-hosted because Discord's Activity CSP blocks
         Google Fonts; all OFL, latin subsets from Fontsource. Ui.sans is
         Atkinson Hyperlegible, Ui.mono IBM Plex Mono. Ui.glyph puts the two
         Noto symbol faces first for the marks: Apple Symbols draws ☼ as a thin
         ring that reads as "empty". Noto Sans Symbols 2 has ☼ but not ☽ or the
         arrows, which come from Noto Sans Symbols; each is cut down to the few
         marks the UI draws (☼ ✎ ◈ ▾ / ☽ ↑ ↓ →). */
      @font-face {
        font-family: "Atkinson Hyperlegible";
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url("/fonts/atkinson-hyperlegible-latin-400-normal.woff2") format("woff2");
      }
      @font-face {
        font-family: "Atkinson Hyperlegible";
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url("/fonts/atkinson-hyperlegible-latin-700-normal.woff2") format("woff2");
      }
      @font-face {
        font-family: "Atkinson Hyperlegible";
        font-style: italic;
        font-weight: 400;
        font-display: swap;
        src: url("/fonts/atkinson-hyperlegible-latin-400-italic.woff2") format("woff2");
      }
      @font-face {
        font-family: "IBM Plex Mono";
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url("/fonts/ibm-plex-mono-latin-400-normal.woff2") format("woff2");
      }
      @font-face {
        font-family: "IBM Plex Mono";
        font-style: normal;
        font-weight: 500;
        font-display: swap;
        src: url("/fonts/ibm-plex-mono-latin-500-normal.woff2") format("woff2");
      }
      @font-face {
        font-family: "Noto Sans Symbols 2";
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url("/fonts/noto-sans-symbols-2-marks.woff2") format("woff2");
        unicode-range: U+263C, U+270E, U+25C8, U+25BE;
      }
      @font-face {
        font-family: "Noto Sans Symbols";
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url("/fonts/noto-sans-symbols-marks.woff2") format("woff2");
        unicode-range: U+263D, U+2191-2193;
      }

      /* The three-column layout (roadmap section 23.5) is a fixed-height
         `Element.layout` that fills the viewport; elm-ui measures `height
         fill` against its parent, so every ancestor up to `html` needs an
         explicit height for that to reach anywhere — `#root` included, since
         a bare `<div>` does not inherit its parent's percentage height. */
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
      }

      /* Ui.splitButton (roadmap 31.5): a character aspect whose left half
         Complicates and right half Highlights. elm-ui's mouseOver cannot draw
         a gradient, so the washes and the hover labels live here. Each half
         washes from its outer edge; its label (red / green is the commonest
         colour-blind confusion) appears on hover, focus or press. On touch
         there is no hover, so both halves keep a faint resting tint. */
      .split-half .split-label {
        opacity: 0;
        transition: opacity 120ms;
      }
      .split-half:hover .split-label,
      .split-half:focus-visible .split-label,
      .split-half:active .split-label {
        opacity: 1;
      }
      .split-left:hover,
      .split-left:focus-visible,
      .split-left:active {
        background: linear-gradient(to right, rgba(158, 0, 0, 0.16), rgba(158, 0, 0, 0)) !important;
      }
      .split-right:hover,
      .split-right:focus-visible,
      .split-right:active {
        background: linear-gradient(to left, rgba(0, 102, 43, 0.18), rgba(0, 102, 43, 0)) !important;
      }
      @media (hover: none) {
        .split-left {
          background: linear-gradient(to right, rgba(158, 0, 0, 0.07), rgba(158, 0, 0, 0)) !important;
        }
        .split-right {
          background: linear-gradient(to left, rgba(0, 102, 43, 0.08), rgba(0, 102, 43, 0)) !important;
        }
      }
      .split-half.is-off,
      .split-half.is-off:hover,
      .split-half.is-off:active {
        background: none !important;
        cursor: default;
      }
      .split-half.is-off .split-label {
        opacity: 0 !important;
      }
    </style>
    <script>
      // Inject environment-style values for the client. build.mjs replaces
      // the client id placeholder with the Wrangler environment's
      // DISCORD_CLIENT_ID.
      window.DISCORD_CLIENT_ID = "%DISCORD_CLIENT_ID%";
      window.BACKEND_BASE_URL = "";
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script src="/elm.js"></script>
    <script type="module" src="/main.js"></script>
  </body>
</html>
