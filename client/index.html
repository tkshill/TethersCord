<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>TTRPG Discord Activity</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      /* Self-hosted so it loads under Discord's Activity CSP; the latin subset
         of Inter as a single variable file. Ui.sans lists "Inter" first with a
         system fallback, so a failed load degrades quietly. */
      @font-face {
        font-family: "Inter";
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
        src: url("/fonts/inter-latin-wght-normal.woff2") format("woff2");
      }
    </style>
    <script>
      // Inject environment-style values for the client
      window.DISCORD_CLIENT_ID = "1540421919982231692";
      window.BACKEND_BASE_URL = "";
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script src="/elm.js"></script>
    <script type="module" src="/main.js"></script>
  </body>
</html>
