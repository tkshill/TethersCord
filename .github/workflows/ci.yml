name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable corepack (pnpm)
        run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile

      # Bundles the Elm SPA, typechecks the client and worker, then runs the
      # Elm test suite — the same gate as `pnpm run deploy`.
      - name: Build, typecheck, test
        run: pnpm run build
